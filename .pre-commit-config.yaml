---
default_stages: [pre-commit]
exclude: ^3rd_party/
repos:
    - repo: local
      hooks:
          - id: forbid-sensitive-files
            name: Forbid sensitive files
            entry: >-
                bash -c 'printf "Sensitive file must not be committed: %s\n" "$@" >&2; exit 1' --
            language: system
            files: >-
                (^|/)(developer_key|private_key|id_rsa|id_ed25519|id_ecdsa|\.env(\.(local|production))?|[^/]+\.(pem|key|p12|pfx|keystore))$

          - id: make-resource
            name: Generate resources
            entry: make resources
            language: system
            pass_filenames: false
            always_run: true

          - id: prettier-monkeyc
            name: prettier_monkeyc
            language: system
            entry: prettier --plugin @markw65/prettier-plugin-monkeyc --parser monkeyc --write
            files: \.mc$

          - id: pytest
            name: Run pytest
            entry: pytest
            language: system
            pass_filenames: false

    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-ast
          - id: check-builtin-literals
          - id: check-case-conflict
          - id: check-docstring-first
          - id: check-executables-have-shebangs
          - id: check-illegal-windows-names
          - id: check-json
          - id: check-merge-conflict
          - id: check-shebang-scripts-are-executable
          - id: check-symlinks
          - id: check-toml
          - id: check-vcs-permalinks
          - id: check-xml
          - id: check-yaml
          - id: debug-statements
          - id: destroyed-symlinks
          - id: detect-private-key
          - id: end-of-file-fixer
          - id: file-contents-sorter
          - id: fix-byte-order-marker
          - id: forbid-submodules
          - id: mixed-line-ending
          - id: name-tests-test
          - id: pretty-format-json
          - id: requirements-txt-fixer
          - id: sort-simple-yaml
          - id: trailing-whitespace

    - repo: https://github.com/jumanjihouse/pre-commit-hooks
      rev: 3.0.0
      hooks:
          - id: markdownlint
          - id: script-must-have-extension
          - id: script-must-not-have-extension
          - id: shellcheck

    - repo: https://github.com/psf/black
      rev: 26.1.0
      hooks:
          - id: black
            language_version: python3

    - repo: https://github.com/pylint-dev/pylint
      rev: v4.0.6
      hooks:
          - id: pylint
            additional_dependencies: [pytest]

    - repo: https://github.com/pre-commit/mirrors-mypy
      rev: v1.19.1
      hooks:
          - id: mypy
            additional_dependencies: [pytest, types-termcolor, types-PyYAML]

    - repo: https://github.com/asottile/pyupgrade
      rev: v3.21.2
      hooks:
          - id: pyupgrade

    - repo: https://github.com/pycqa/isort
      rev: 7.0.0
      hooks:
          - id: isort

    - repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
      rev: 0.2.3
      hooks:
          - id: yamlfmt
            exclude: |
                (?x)^(
                  .clang-*|
                  .github/
                )

    - repo: https://github.com/detailyang/pre-commit-shell
      rev: 1.0.5
      hooks:
          - id: shell-lint

    - repo: https://github.com/lovesegfault/beautysh
      rev: v6.4.2
      hooks:
          - id: beautysh
            args: [--tab, --force-function-style=paronly]
            additional_dependencies: [setuptools]

    - repo: https://github.com/shellcheck-py/shellcheck-py
      rev: v0.11.0.1
      hooks:
          - id: shellcheck
