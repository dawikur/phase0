# Run distrobox assemble from the repository root.
[phase0-ciq]
image=docker.io/library/ubuntu:22.04
pull=true
replace=false
start_now=true
additional_packages="ca-certificates curl git make ripgrep unzip zip xz-utils openssl zsh"
additional_packages="openjdk-17-jdk libwebkit2gtk-4.0-37 libsecret-1-0 libusb-1.0-0 libgtk-3-0 libxxf86vm1 libsm6 libjpeg8 libgl1 libgl1-mesa-dri"
additional_packages="dbus-x11 xauth wmctrl xdotool python3 python3-venv python3-pip"
additional_flags="--env=PHASE0_PROJECT_DIR=/opt/phase0-src"
volume="${PWD}:/opt/phase0-src"
volume="phase0-ciq-python310-venv:/opt/phase0-src/.venv:nocopy"
volume="phase0-ciq-node-modules:/opt/phase0-src/node_modules:nocopy"
init_hooks='bash "${PHASE0_PROJECT_DIR}/scripts/setup-distrobox" "${container_user_name}"'
