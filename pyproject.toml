[project]
name = "phase"
version = "0.1.0"

[tool.setuptools.packages.find]
where = ["."]

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
pretty = true
show_column_numbers = true

strict = true
ignore_missing_imports = true

[tool.clang-format]
entry = "clang-format-12 -i"
