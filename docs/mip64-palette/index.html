<!doctype html>
<html lang="en" data-palette-sort-control>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Garmin MIP64 Palette</title>
    <link rel="icon" href="../assets/icon.svg" type="image/svg+xml" />
    <script src="../settings-data.js"></script>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../styles.css" />
    <style>
      :root { --color-name: #dfe5db; --swatch-border: rgba(255, 255, 255, 0.32); }
      :root[data-theme="light"] { --color-name: #3b433f; --swatch-border: rgba(19, 24, 21, 0.32); }
      .page { padding: calc(var(--space-5) + clamp(8px, 4vh, 38px)) 0 var(--space-6); }

      .eyebrow a {
        color: inherit;
        text-decoration: none;
      }

      .eyebrow a:hover {
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      .eyebrow a:focus-visible {
        outline: 2px solid var(--focus-ring);
        outline-offset: 3px;
      }

      h1 {
        margin: 0;
        max-width: none;
        font-size: clamp(3.1rem, 9vw, 7.1rem);
        line-height: 0.88;
        letter-spacing: 0;
      }

      .lede {
        max-width: 600px;
        margin: 20px 0 0;
        color: var(--copy);
        font-size: clamp(1.02rem, 2vw, 1.22rem);
        line-height: 1.55;
      }

      .palette-note {
        display: inline-flex;
        align-items: center;
        margin: var(--space-4) 0 var(--space-5);
        border: 1px solid var(--chip-border);
        border-radius: 999px;
        padding: 7px 11px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.045);
        font-size: 0.84rem;
      }

      .sort-control {
        display: inline-grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 2px;
        padding: 3px;
        border: 1px solid var(--chip-border);
        border-radius: 999px;
        background: var(--control-bg);
        box-shadow:
          inset 0 0 0 1px rgba(255, 255, 255, 0.035),
          0 8px 22px rgba(0, 0, 0, 0.16);
      }

      .palette {
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: var(--space-2);
      }

      .color-card {
        min-width: 0;
        border: 1px solid var(--chip-border);
        border-radius: var(--radius);
        padding: 10px;
        background: var(--panel);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.05),
          0 12px 30px rgba(0, 0, 0, 0.14);
        text-align: center;
        transition:
          border-color 150ms ease,
          transform 150ms ease;
      }

      .color-card:hover {
        border-color: rgba(242, 160, 31, 0.48);
        transform: translateY(-2px);
      }

      .palette-swatch {
        appearance: none;
        padding: 0;
        width: 100%;
        aspect-ratio: 1 / 1;
        border: 1px solid var(--swatch-border);
        border-radius: 5px;
        margin-bottom: 8px;
        position: relative;
        overflow: hidden;
        cursor: pointer;

        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.24),
          0 6px 16px rgba(0, 0, 0, 0.3);
        transition:
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .palette-swatch:focus-visible {
        outline: 3px solid var(--focus-ring);
        outline-offset: 3px;
      }

      .palette-swatch.is-copied {
        border-color: rgba(0, 0, 0, 0.65);
        background-clip: padding-box;
      }

      .copied-label {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 0.78rem;
        font-weight: 700;
        color: white;
        background: rgba(0, 0, 0, 0.45);
        border-radius: inherit;

        pointer-events: none;
        opacity: 1;
      }

      .hex {
        font-family: monospace;
        color: var(--ink);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .name {
        min-height: 2.7em;
        margin-top: 3px;
        color: var(--color-name);
        font-size: 0.8rem;
        line-height: 1.35;
      }

      @media (prefers-reduced-motion: reduce) {
        .palette-swatch {
          transition: none;
        }
      }

      @media (max-width: 560px) {
        .page {
          width: calc(100% - 20px);
          padding-top: 18px;
        }

        .palette {
          grid-template-columns: repeat(auto-fit, minmax(92px, 1fr));
          gap: 8px;
        }

        .color-card {
          padding: 7px;
        }
      }

      @media (min-width: 561px) and (max-width: 960px) {
        .palette {
          grid-template-columns: repeat(auto-fit, minmax(116px, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="controls">
        <div class="theme-control" role="group" aria-label="Page theme">
          <button class="theme-option" type="button" data-theme-mode="auto">Auto</button>
          <button class="theme-option" type="button" data-theme-mode="light">Light</button>
          <button class="theme-option" type="button" data-theme-mode="dark">Dark</button>
        </div>
        <div class="sort-control" role="group" aria-label="Palette sort order">
          <button class="view-option" type="button" data-sort-mode="hue" aria-pressed="true">Hue</button>
          <button class="view-option" type="button" data-sort-mode="lightness" aria-pressed="false">Lightness</button>
          <button class="view-option" type="button" data-sort-mode="rgb" aria-pressed="false">RGB</button>
        </div>
      </div>
      <p class="eyebrow"><a href="../" data-theme-transfer>← phase0</a> · Garmin display reference</p>
      <h1>Garmin MIP64 Palette</h1>
      <p class="lede">
        A compact reference for the 64-color MIP palette. Select any swatch to
        copy its RGB value in Garmin-friendly hexadecimal notation.
      </p>
      <p class="palette-note">64 colors · click a swatch to copy</p>
      <div class="palette" id="palette"></div>
    </main>

    <script>
      const STEPS = [0x00, 0x55, 0xaa, 0xff];
      const settingsData = window.PHASE_SETTINGS || { groups: [] };

      // Convert RGB to HSL for nice gradient sorting
      function rgbToHsl(r, g, b) {
        r /= 255;
        g /= 255;
        b /= 255;
        const max = Math.max(r, g, b),
          min = Math.min(r, g, b);
        let h,
          s,
          l = (max + min) / 2;

        if (max === min) {
          h = s = 0;
        } else {
          const d = max - min;
          s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
          switch (max) {
            case r:
              h = (g - b) / d + (g < b ? 6 : 0);
              break;
            case g:
              h = (b - r) / d + 2;
              break;
            case b:
              h = (r - g) / d + 4;
              break;
          }
          h /= 6;
        }
        return [h, s, l];
      }

      function toHex(v) {
        return v.toString(16).padStart(2, "0").toUpperCase();
      }

      function hexFromDecimalColor(value) {
        const color = Number(value);
        if (!Number.isInteger(color) || color < 0 || color > 0xffffff) {
          return null;
        }
        return `#${color.toString(16).padStart(6, "0").toUpperCase()}`;
      }

      function settingColorNames() {
        const general = settingsData.groups.find((group) => group.id === "General");
        const accent = general?.settings.find((setting) => setting.key === "GeneralAccent");
        if (!accent) {
          return new Map();
        }

        return new Map(
          accent.options
            .map((option) => [hexFromDecimalColor(option.value), option.label])
            .filter(([hex]) => hex),
        );
      }

      const SETTING_COLOR_NAMES = settingColorNames();

      // Generate colors
      let colors = [];
      for (let r of STEPS) {
        for (let g of STEPS) {
          for (let b of STEPS) {
            const [h, s, l] = rgbToHsl(r, g, b);
            colors.push({ r, g, b, h, s, l });
          }
        }
      }

      const palette = document.getElementById("palette");
      const sortButtons = document.querySelectorAll("[data-sort-mode]");

      function compareColors(mode, a, b) {
        if (mode === "lightness") {
          return a.l - b.l || a.h - b.h || a.s - b.s;
        }
        if (mode === "rgb") {
          return a.r - b.r || a.g - b.g || a.b - b.b;
        }
        return a.h - b.h || a.s - b.s || a.l - b.l;
      }

      function sortPalette(mode) {
		if (!["hue", "lightness", "rgb"].includes(mode)) mode = "hue";
        colors.sort((a, b) => compareColors(mode, a, b));
        colors.forEach((color) => palette.appendChild(color.card));
		document.documentElement.dataset.paletteSort = mode;
		window.phaseTheme.updateTransferLinks();
        sortButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.sortMode === mode));
        });
      }

      // Create cards once; sorting only moves existing cards in the grid.
      colors.forEach((c) => {
        const hex = `#${toHex(c.r)}${toHex(c.g)}${toHex(c.b)}`;

        const card = document.createElement("div");
        card.className = "color-card";
        const swatch = document.createElement("button");
        swatch.type = "button";
        swatch.className = "palette-swatch";
        swatch.style.background = hex;
        swatch.setAttribute("aria-label", `Copy ${hex} as a hexadecimal value`);
        swatch.addEventListener("click", async () => {
          const xhex = `0x${toHex(c.r)}${toHex(c.g)}${toHex(c.b)}`;

          try {
            if (await copyText(xhex)) {
              showCopied(swatch);
            }
          } catch (err) {
            console.error("Clipboard error:", err);
          }
        });

        const hexLabel = document.createElement("div");
        hexLabel.className = "hex";
        hexLabel.textContent = hex;

        const nameLabel = document.createElement("div");
        nameLabel.className = "name";
        nameLabel.textContent = SETTING_COLOR_NAMES.get(hex) || "";

        card.appendChild(swatch);
        card.appendChild(hexLabel);
        card.appendChild(nameLabel);
        c.card = card;
      });

      sortButtons.forEach((button) => {
        button.addEventListener("click", () => sortPalette(button.dataset.sortMode));
      });
      sortPalette(document.documentElement.dataset.paletteSort || "hue");

      function showCopied(swatch) {
        const existing = swatch.querySelector(".copied-label");
        if (existing) existing.remove();

        swatch.classList.add("is-copied");

        const label = document.createElement("div");
        label.className = "copied-label";
        label.textContent = "Copied";

        swatch.appendChild(label);

        const clearCopied = () => {
          label.remove();
          if (!swatch.querySelector(".copied-label")) {
            swatch.classList.remove("is-copied");
          }
        };
        setTimeout(() => {
          label.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: 800, easing: "ease-out", fill: "forwards" },
          );
        }, 200);
        setTimeout(clearCopied, 1200);
      }

      async function copyText(text) {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }

        const field = document.createElement("textarea");
        field.value = text;
        field.style.position = "fixed";
        field.style.opacity = "0";
        document.body.appendChild(field);
        field.select();
        const copied = document.execCommand("copy");
        field.remove();
        return copied;
      }

    </script>
  </body>
</html>
