<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>MIP64 Palette</title>
<style>
	body {
		font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
		background: #f5f5f5;
		padding: 20px;
	}

	.palette {
		display: grid;
		grid-template-columns: repeat(8, 1fr);
		gap: 16px;
		max-width: 1000px;
		margin: auto;
	}

	.color-card {
		text-align: center;
		font-size: 12px;
	}

	.swatch {
		width: 100%;
		aspect-ratio: 1 / 1;
		border-radius: 6px;
		border: 1px solid rgba(0,0,0,0.15);
		margin-bottom: 6px;
	}

	.hex {
		font-family: monospace;
		font-weight: 600;
	}

	.name {
		color: #555;
		font-size: 11px;
	}
</style>
</head>
<body>

<h2 style="text-align:center">MIP64 Palette</h2>

<div class="palette" id="palette"></div>

<script>
const STEPS = [0x00, 0x55, 0xAA, 0xFF];

// from https://www.colorhexa.com
COLOR_NAMES = {
	"#000000": "Black",
	"#000055": "Very dark blue",
	"#0000AA": "Dark blue",
	"#0000FF": "Pure blue",
	"#005500": "Very dark lime green",
	"#005555": "Very dark cyan",
	"#0055AA": "Dark blue",
	"#0055FF": "Pure blue",
	"#00AA00": "Dark lime green",
	"#00AA55": "Dark cyan - lime green",
	"#00AAAA": "Dark cyan",
	"#00AAFF": "Pure blue",
	"#00FF00": "Pure lime green",
	"#00FF55": "Pure cyan - lime green",
	"#00FFAA": "Pure cyan - lime green",
	"#00FFFF": "Pure cyan",
	"#550000": "Very dark red",
	"#550055": "Very dark magenta",
	"#5500AA": "Dark violet",
	"#5500FF": "Pure violet",
	"#555500": "Very dark yellow",
	"#555555": "Very dark gray",
	"#5555AA": "Dark moderate blue",
	"#5555FF": "Light blue",
	"#55AA00": "Dark green",
	"#55AA55": "Dark moderate lime green",
	"#55AAAA": "Dark moderate cyan",
	"#55AAFF": "Light blue",
	"#55FF00": "Pure green",
	"#55FF55": "Light lime green",
	"#55FFAA": "Light cyan - lime green",
	"#55FFFF": "Light cyan",
	"#AA0000": "Dark red",
	"#AA0055": "Dark pink",
	"#AA00AA": "Dark magenta",
	"#AA00FF": "Pure violet",
	"#AA5500": "Dark orange",
	"#AA5555": "Dark moderate red",
	"#AA55AA": "Dark moderate magenta",
	"#AA55FF": "Light violet",
	"#AAAA00": "Dark yellow",
	"#AAAA55": "Dark moderate yellow",
	"#AAAAAA": "Gray",
	"#AAAAFF": "Pale blue",
	"#AAFF00": "Pure green",
	"#AAFF55": "Light green",
	"#AAFFAA": "Pale lime green",
	"#AAFFFF": "Pale cyan",
	"#FF0000": "Pure red",
	"#FF0055": "Pure pink",
	"#FF00AA": "Pure pink",
	"#FF00FF": "Pure magenta",
	"#FF5500": "Pure orange",
	"#FF5555": "Light red",
	"#FF55AA": "Light pink",
	"#FF55FF": "Light magenta",
	"#FFAA00": "Pure orange",
	"#FFAA55": "Light orange",
	"#FFAAAA": "Pale red",
	"#FFAAFF": "Pale magenta",
	"#FFFF00": "Pure yellow",
	"#FFFF55": "Light yellow",
	"#FFFFAA": "Pale yellow",
	"#FFFFFF": "White",
};


// Convert RGB to HSL for nice gradient sorting
function rgbToHsl(r, g, b) {
	r /= 255; g /= 255; b /= 255;
	const max = Math.max(r, g, b), min = Math.min(r, g, b);
	let h, s, l = (max + min) / 2;

	if (max === min) {
		h = s = 0;
	} else {
		const d = max - min;
		s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
		switch (max) {
			case r: h = (g - b) / d + (g < b ? 6 : 0); break;
			case g: h = (b - r) / d + 2; break;
			case b: h = (r - g) / d + 4; break;
		}
		h /= 6;
	}
	return [h, s, l];
}

function toHex(v) {
	return v.toString(16).padStart(2, "0").toUpperCase();
}

// Generate colors
let colors = [];
for (let r of STEPS) {
	for (let g of STEPS) {
		for (let b of STEPS) {
			const [h, s, l] = rgbToHsl(r, g, b);
			y=0.2126*r+0.7152*g+0.0722*b
			colors.push({ r, g, b, h, s, l, y });
		}
	}
}

// Sort by Hue → Saturation → Lightness
colors.sort((a, b) =>
	a.h - b.h ||
	a.s - b.s ||
	a.l - b.l ||
	0
);

const palette = document.getElementById("palette");

// Render
colors.forEach(c => {
	const hex = `#${toHex(c.r)}${toHex(c.g)}${toHex(c.b)}`;

	const card = document.createElement("div");
	card.className = "color-card";

	const swatch = document.createElement("div");
	swatch.className = "swatch";
	swatch.style.background = hex;

	const hexLabel = document.createElement("div");
	hexLabel.className = "hex";
	hexLabel.textContent = hex;

	const nameLabel = document.createElement("div");
	nameLabel.className = "name";
	nameLabel.textContent = COLOR_NAMES[hex];

	card.appendChild(swatch);
	card.appendChild(hexLabel);
	card.appendChild(nameLabel);
	palette.appendChild(card);
});
</script>

</body>
</html>
